name: mobile
description: "Application mobile Rehoboth Groupe — Mise en relation clients/techniciens."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  # HTTP client avec intercepteurs JWT
  dio: ^5.9.2
  # Stockage sécurisé des tokens
  flutter_secure_storage: ^10.0.0
  # Gestion d'état
  provider: ^6.1.5+1
  # Géolocalisation GPS
  geolocator: ^14.0.2
  # Formatage de dates
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
